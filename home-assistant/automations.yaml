# Paste into automations.yaml, or recreate in the UI.
# Create two webhook automations; copy the webhook IDs into the Photon firmware.
# Keep local_only: true. Treat webhook IDs as secrets.

input_datetime:
  sewer_detector_last_ok:
    name: Sewer detector last ok
    has_date: true
    has_time: true

automation:
  - id: sewer_backup_alarm
    alias: Sewer backup alarm
    mode: single
    trigger:
      - platform: webhook
        webhook_id: YOUR_ALARM_WEBHOOK_ID
        allowed_methods:
          - POST
        local_only: true
    action:
      - service: notify.notify
        data:
          title: Sewer backup
          message: Float has been up for 2+ seconds. Stop draining water.

  - id: sewer_detector_heartbeat
    alias: Sewer detector heartbeat
    mode: single
    trigger:
      - platform: webhook
        webhook_id: YOUR_HEARTBEAT_WEBHOOK_ID
        allowed_methods:
          - POST
        local_only: true
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sewer_detector_last_ok
        data:
          timestamp: "{{ now().timestamp() }}"

  - id: sewer_detector_silent
    alias: Sewer detector missed heartbeat
    mode: single
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: template
        value_template: >-
          {{ states('input_datetime.sewer_detector_last_ok') in ['unknown', 'unavailable', '']
             or (now() - states('input_datetime.sewer_detector_last_ok') | as_datetime | as_local).days >= 30 }}
    action:
      - service: notify.notify
        data:
          title: Sewer detector silent
          message: No heartbeat in 30 days. Check power, Wi-Fi, and the Photon.
